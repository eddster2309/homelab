apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  timeout: 2h
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.1.0

    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: nfs-data-pvc
      configuration:
        oauth:
          autoLaunch: true
          autoRegister: true
          clientId: immich
          clientSecret: $OAUTH_CLIENT_SECRET
          enabled: true
          issuerUrl: https://auth.0b.au/.well-known/openid-configuration
        passwordLogin:
          enabled: false
        machineLearning:
          duplicateDetection:
            enabled: true
            maxDistance: 0.03
        server:
          externalDomain: https://immich.0b.au/share

    valkey:
      enabled: false

    server:
      enabled: true
      controllers:
        main:
          strategy: Recreate
          initContainers:
            envsubst:
              image:
                repository: bhgedigital/envsubst
                tag: latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  envsubst < /config/immich-config.yaml > /templated-config/immich-config.yaml
              env:
                OAUTH_CLIENT_SECRET:
                  valueFrom:
                    secretKeyRef:
                      name: oidc-secret
                      key: OAUTH_CLIENT_SECRET
          containers:
            main:
              # The v3 migration reindexes clip_index/face_index before the HTTP
              # listener binds. Allow up to 2h before kubelet restarts the pod --
              # interrupting the reindex leaves it to start over.
              probes:
                startup:
                  spec:
                    failureThreshold: 720
              env:
                REDIS_HOSTNAME: immich-dragonfly.immich.svc.cluster.local
                TZ: Australia/Sydney
                IMMICH_CONFIG_FILE: /templated-config/immich-config.yaml
                DB_HOSTNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-app
                      key: host
                DB_USERNAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-app
                      key: user
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-app
                      key: password
                DB_DATABASE_NAME:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-app
                      key: dbname
      persistence:
        templated-config:
          enabled: true
          type: emptyDir
      ingress:
        main:
          enabled: true
          className: traefik
          annotations:
            kubernetes.io/ingress.class: "traefik"
          hosts:
            - host: immich.0b.au
              paths:
                - path: /
                  service:
                    identifier: main