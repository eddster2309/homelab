# The runner authentication token for the `proxmox-fleeting` instance runner
# (GitLab runner id 2111). The key names are fixed by the gitlab-runner chart:
# its entrypoint reads /secrets/runner-token and exports it as CI_SERVER_TOKEN.
#
# runner-registration-token is deliberately empty rather than absent. The chart
# projects both keys as explicit items with no `optional: true`, so a missing
# key leaves the pod stuck in ContainerCreating — even though a `glrt-` token
# needs no registration token. The entrypoint only exports REGISTRATION_TOKEN
# when the file exists, and an empty one is ignored.
#
# Because this is a `glrt-` authentication token, the chart deliberately drops
# --tag-list and --run-untagged at registration: tags (`proxmox`) and untagged
# behaviour are properties of the runner in GitLab, not of this manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-fleeting-token
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-fleeting-token
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        runner-token: "{{ .token }}"
        runner-registration-token: ""
  data:
  - secretKey: token
    remoteRef:
      key: gitlab-runner-fleeting/runner
      property: token
