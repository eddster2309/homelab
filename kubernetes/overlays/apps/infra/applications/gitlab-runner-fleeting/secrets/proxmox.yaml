# Proxmox API token the fleeting plugin clones instances with. Shared with the
# Ansible-managed runner fleet, hence the gitlab/ path rather than one of our
# own — it is the dedicated `svc_gitlab@pam!runner_fleet` token, scoped to the
# `fleeting` pool.
#
# The plugin reads these from its environment rather than a credentials file;
# the runner starts it as a child process, so the pod's environment reaches it
# unchanged. See "Configuration through the environment" in the plugin README.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-fleeting-proxmox
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-fleeting-proxmox
    creationPolicy: 'Owner'
  data:
  - secretKey: token_id
    remoteRef:
      key: gitlab/proxmox
      property: id
  - secretKey: secret
    remoteRef:
      key: gitlab/proxmox
      property: secret
