# Credentials for the GitLab Runner distributed cache on versitygw, shared with
# the in-cluster runner in the gitlab namespace. The key names are fixed by the
# gitlab-runner chart: it projects this secret at /secrets and its entrypoint
# exports CACHE_S3_ACCESS_KEY / CACHE_S3_SECRET_KEY from files named accesskey
# and secretkey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner-fleeting-cache
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-runner-fleeting-cache
    creationPolicy: 'Owner'
  data:
  - secretKey: accesskey
    remoteRef:
      key: versitygw/gitlab-runner
      property: access_key
  - secretKey: secretkey
    remoteRef:
      key: versitygw/gitlab-runner
      property: secret_key
