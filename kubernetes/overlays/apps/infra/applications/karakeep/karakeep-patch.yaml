apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: karakeep
spec:
  chart:
    spec:
      version: "0.33.1"
  values:
    controllers:
      # The chart defaults to gcr.io/zenika-hub/alpine-chrome, whose gcr.io
      # mirror now 403s on anonymous token requests. Same image and tag, pulled
      # from the project's canonical Docker Hub repo instead.
      chrome:
        containers:
          chrome:
            image:
              repository: zenika/alpine-chrome
              tag: "124"
      karakeep:
        containers:
          karakeep:
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 2Gi
            env:
              DISABLE_PASSWORD_AUTH: "true"
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
              OAUTH_PROVIDER_NAME: OIDC
              OAUTH_SCOPE: openid email profile
              OAUTH_WELLKNOWN_URL: https://auth.0b.au/.well-known/openid-configuration
              OAUTH_CLIENT_ID: karakeep
              NEXTAUTH_URL: https://karakeep.0b.au
              # Inference/embeddings go through OpenRouter's OpenAI-compatible
              # API. OPENAI_API_KEY (from generic-secrets) now holds the
              # OpenRouter key; model ids must carry the vendor prefix.
              #
              # The only inference job that runs here is tag extraction
              # (auto-summarisation is off by default) over at most
              # INFERENCE_CONTEXT_LENGTH=2048 tokens, so a small cheap model
              # with reliable structured-output support is the right tier.
              OPENAI_BASE_URL: https://openrouter.ai/api/v1
              INFERENCE_TEXT_MODEL: z-ai/glm-5.3-flash
              INFERENCE_IMAGE_MODEL: z-ai/glm-5.3-flash
              EMBEDDING_TEXT_MODEL: openai/text-embedding-3-small
              EMBEDDING_DIMENSIONS: "1536"
              CRAWLER_FULL_PAGE_ARCHIVE: "true"
              CRAWLER_FULL_PAGE_SCREENSHOT: "true"
              CRAWLER_NUM_WORKERS: "2"
              CRAWLER_SCREENSHOT_TIMEOUT_SEC: "15"
              # Archiving runs last in the crawl pipeline, so it inherits
              # whatever is left of CRAWLER_JOB_TIMEOUT_SEC. monolith inlines
              # every subresource into one file; the 5s default was killing
              # ~26 of every 27 archive attempts.
              CRAWLER_MONOLITH_TIMEOUT_SEC: "45"
              CRAWLER_JOB_TIMEOUT_SEC: "180"
              ASSET_STORE_S3_ENDPOINT: https://s3.0b.au
              ASSET_STORE_S3_REGION: us-east-1
              ASSET_STORE_S3_BUCKET: rke-karakeep-store
              # versitygw serves both addressing styles; pin path style so this
              # does not depend on the *.s3.0b.au wildcard.
              ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
            envFrom:
              - secretRef:
                  name: oidc-secret
              - secretRef:
                  name: generic-secrets
        statefulset:
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 20Gi
              globalMounts:
                - path: /data
    applicationHost: karakeep.0b.au
    ingress:
      karakeep:
        className: traefik
    meilisearch:
      persistence:
        enabled: true
        accessMode: ReadWriteOnce
        storageClass: longhorn
      environment:
        MEILI_ENV: production
        MEILI_NO_ANALYTICS: true
      envFrom:
        - secretRef:
            name: generic-secrets
            items:
              - key: MEILI_MASTER_KEY