# Same versitygw credentials the CNPG barman backups use -- the MariaDB dumps
# land in the existing rke-cnpg-backups bucket under their own prefix, so no new
# bucket or key has to be provisioned out of band.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matomo-backup-s3
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matomo-backup-s3
    creationPolicy: 'Owner'
  data:
  - secretKey: ACCESS_KEY_ID
    remoteRef:
      key: versitygw/cnpg
      property: access_key
  - secretKey: ACCESS_SECRET_KEY
    remoteRef:
      key: versitygw/cnpg
      property: secret_key
