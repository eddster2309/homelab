apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matomo-db-credentials
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matomo-db-credentials
    creationPolicy: 'Owner'
  data:
  - secretKey: root-password
    remoteRef:
      key: matomo/database
      property: root_password
  - secretKey: password
    remoteRef:
      key: matomo/database
      property: password
