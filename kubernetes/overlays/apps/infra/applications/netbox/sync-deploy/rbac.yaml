apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbox-sync
---
# Read-only view of what netbox-sync maps into NetBox: node IPs, LoadBalancer
# VIPs and the Cilium pools they come from, selector-less Services (external
# hosts) and Traefik routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbox-sync
rules:
  - apiGroups: [""]
    resources: [nodes, services]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, ingressroutetcps]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumloadbalancerippools]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbox-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbox-sync
subjects:
  - kind: ServiceAccount
    name: netbox-sync
    namespace: netbox
