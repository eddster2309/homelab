# Vault:
#   k8s-infra/netbox/sync            netbox_token (v2 nbt_…), opnsense_key, opnsense_secret,
#                                    ipa_user, ipa_password
#   k8s-infra/netbox/proxbox/credentials  domain, user, token_id, token_secret (Proxmox API token)
#   k8s-infra/netflow/clickhouse     netbox_sync_password (ClickHouse user that writes netflow.nb_*)
#   k8s-infra/omada-exporter/credentials  id, secret (Omada OpenAPI client, shared with omada-exporter),
#                                         user, password (its web API login: live port speeds, AP uplink ports)
#   k8s-infra/monitoring/wazuh-grafana  password (read-only Wazuh indexer user "grafana", shared with Grafana)
#   k8s-infra/netbox/ilo             user, password (read-only iLO login, Redfish)
#   k8s-infra/netbox/homeassistant   token (long-lived token of a non-admin Home Assistant user)
#   k8s-infra/binarylane/credentials api_token (Binary Lane API, shared with garage's Terraform)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-sync
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netbox-sync
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        NETBOX_TOKEN: '{{ .netbox_token }}'
        OPNSENSE_KEY: '{{ .opnsense_key }}'
        OPNSENSE_SECRET: '{{ .opnsense_secret }}'
        IPA_USER: '{{ .ipa_user }}'
        IPA_PASSWORD: '{{ .ipa_password }}'
        PROXMOX_URL: 'https://{{ .domain }}:8006'
        PROXMOX_TOKEN_ID: '{{ .user }}!{{ .token_id }}'
        PROXMOX_TOKEN_SECRET: '{{ .token_secret }}'
        CLICKHOUSE_PASSWORD: '{{ .netbox_sync_password }}'
        OMADA_CLIENT_ID: '{{ .omada_id }}'
        OMADA_CLIENT_SECRET: '{{ .omada_secret }}'
        OMADA_USER: '{{ .omada_user }}'
        OMADA_PASS: '{{ .omada_password }}'
        WAZUH_PASSWORD: '{{ .wazuh_password }}'
        BMC_USER: '{{ .ilo_user }}'
        BMC_PASSWORD: '{{ .ilo_password }}'
        HA_TOKEN: '{{ .ha_token }}'
        BINARYLANE_TOKEN: '{{ .binarylane_api_token }}'
  dataFrom:
  - extract:
      key: netbox/sync
  - extract:
      key: netbox/proxbox/credentials
  - extract:
      key: netflow/clickhouse
  # Prefixed: its user/password keys would otherwise collide with the Proxmox ones
  - extract:
      key: omada-exporter/credentials
    rewrite:
    - regexp:
        source: "(.*)"
        target: "omada_$1"
  - extract:
      key: monitoring/wazuh-grafana
    rewrite:
    - regexp:
        source: "(.*)"
        target: "wazuh_$1"
  - extract:
      key: netbox/ilo
    rewrite:
    - regexp:
        source: "(.*)"
        target: "ilo_$1"
  - extract:
      key: netbox/homeassistant
    rewrite:
    - regexp:
        source: "(.*)"
        target: "ha_$1"
  - extract:
      key: binarylane/credentials
    rewrite:
    - regexp:
        source: "(.*)"
        target: "binarylane_$1"
