# OPNsense + Proxmox + Kubernetes + FreeIPA DNS -> NetBox -> ClickHouse (netflow.nb_*).
# Code: ./sync (ConfigMap netbox-sync-code). Tests: cd sync && uv run --with pytest,requests,netaddr pytest tests
#
# Rollout: create the Vault credentials, unsuspend, read a dry-run's logs
# (kubectl -n netbox logs job/<name>), then set SYNC_DRY_RUN to "false".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: netbox-sync
spec:
  schedule: "*/5 * * * *"
  # Forbid only covers Jobs the CronJob creates: a manual `kubectl create job --from`
  # can race a scheduled run (the sync then removes the duplicate VIPs it finds).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: netbox-sync
        spec:
          serviceAccountName: netbox-sync
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: sync
              image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
              command: [uv, run, --no-project, --with, "requests>=2.32,kubernetes>=31,netaddr>=1.3,websocket-client>=1.8",
                        python, /app/main.py]
              env:
                # "true": log planned NetBox writes and skip the ClickHouse export
                - name: SYNC_DRY_RUN
                  value: "false"
                - name: UV_CACHE_DIR
                  value: /tmp/uv
                - name: HOME
                  value: /tmp
                - name: NETBOX_URL
                  value: http://netbox.netbox.svc
                # The firewall's address on the kubernetes VLAN; NET_MGMT (REDACTED_IP) isn't reachable from the nodes
                - name: OPNSENSE_URL
                  value: https://REDACTED_IP
                - name: OMADA_URL
                  value: https://REDACTED_IP
                - name: IPA_URL
                  value: https://ipa01.internal
                - name: IPA_CA_BUNDLE
                  value: /etc/ssl/ipa/ca-certificates.crt
                - name: CLICKHOUSE_URL
                  value: http://clickhouse-netflow.netflow.svc:8123
                - name: SITE_SLUG
                  value: jack-cbr
                - name: PVE_CLUSTER
                  value: pve-jack-cbr
                - name: FIREWALL_NAME
                  value: jack-cbr-fw01
                # keepalived floating IPs (found as extra /32s on VMs) -> NetBox FHRP group names
                - name: VIP_NAMES
                  value: "REDACTED_IP=dns,REDACTED_IP=dns,REDACTED_IP=dns"
                # Server BMCs read over Redfish (hydrogen's iLO 4); login BMC_USER/BMC_PASSWORD
                - name: BMC_HOSTS
                  value: "REDACTED_IP"
              envFrom:
                - secretRef:
                    name: netbox-sync
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: ipa-ca
                  mountPath: /etc/ssl/ipa
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: code
              configMap:
                name: netbox-sync-code
            - name: tmp
              emptyDir: {}
            - name: ipa-ca
              configMap:
                name: ipa-ca
