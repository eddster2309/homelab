apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbox
resources:
- ../../../../../bases/netbox
- ./database
- ./oidc-secret.yaml
- ./secrets/api-token-peppers.yaml
- ./superuser-secret.yaml
- ./sso-pipeline-configmap.yaml
- ./smtp-secret.yaml
- ./sync-deploy/rbac.yaml
- ./sync-deploy/secret.yaml
- ./sync-deploy/cronjob.yaml
- ./registry-pull-secret.yaml
components:
- ../../../../../components/cnpg-barman-backup
# ipa-ca ConfigMap: netbox-sync verifies FreeIPA's TLS with it
- ../../../../../components/ca-certs
patches:
- target:
    kind: HelmRelease
    name: netbox
  path: netbox-patch.yaml
- target:
    kind: ScheduledBackup
    name: cnpg-nightly-backup
  patch: |
    - op: replace
      path: /spec/cluster/name
      value: netbox-db
- target:
    kind: RoleBinding
    name: cnpg-backup-s3-reader
  patch: |
    - op: replace
      path: /subjects/0/name
      value: netbox-db
