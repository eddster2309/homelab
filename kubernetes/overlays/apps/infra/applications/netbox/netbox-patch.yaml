apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  timeout: 10m
  chart:
    spec:
      chart: netbox
      version: "8.3.91"
      # Lets Renovate resolve the pinned version; must match the base.
      sourceRef:
        kind: HelmRepository
        name: netbox
        namespace: flux-system
  values:
    superuser:
      existingSecret: netbox-superuser

    existingSecret: netbox-config-secret

    # The chart preset's 1536Mi limit OOM-killed NetBox every couple of hours once
    # netbox-sync started calling the API every 5 minutes.
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
        ephemeral-storage: 50Mi
      limits:
        cpu: 750m
        memory: 3Gi
        ephemeral-storage: 2Gi

    allowedHosts:
      - netbox.0b.au
      # in-cluster API clients (netbox-sync)
      - netbox.netbox.svc
      - netbox.netbox.svc.cluster.local

    csrf:
      trustedOrigins:
        - https://netbox.0b.au

    loginRequired: true

    email:
      server: mail.smtpgo.com
      useTLS: true
      port: 465
      username:
      from: "Eddster Netbox <noreply@0b.au>"
      existingSecretName: netbox-smtp

    preferIPv4: true

    timeZone: Australia/Sydney

    postgresql:
      enabled: false

    externalDatabase:
      host: netbox-db-rw.netbox.svc.cluster.local
      port: 5432
      database: app
      username: app
      existingSecretName: netbox-db-app
      existingSecretKey: password

    # Disable bundled Valkey — using Dragonfly
    valkey:
      enabled: false

    tasksDatabase:
      host: netbox-dragonfly.netbox.svc.cluster.local
      port: 6379
      database: 0

    cachingDatabase:
      host: netbox-dragonfly.netbox.svc.cluster.local
      port: 6379
      database: 1

    remoteAuth:
      enabled: true
      backends:
        - social_core.backends.open_id_connect.OpenIdConnectAuth
      autoCreateUser: true
      autoCreateGroups: true
      groupSyncEnabled: false

    extraConfig:
      - secret:
          secretName: netbox-api-token-peppers
      - secret:
          secretName: netbox-oidc-config
      - values:
          SOCIAL_AUTH_PIPELINE:
            - social_core.pipeline.social_auth.social_details
            - social_core.pipeline.social_auth.social_uid
            - social_core.pipeline.social_auth.social_user
            - social_core.pipeline.user.get_username
            - social_core.pipeline.social_auth.associate_by_email
            - social_core.pipeline.user.create_user
            - social_core.pipeline.social_auth.associate_user
            - netbox.authentication.user_default_groups_handler
            - social_core.pipeline.social_auth.load_extra_data
            - social_core.pipeline.user.user_details
            - netbox.sso_pipeline_roles.set_role
          SOCIAL_AUTH_STAFF_ROLE: k8s-netbox-staff
          SOCIAL_AUTH_SUPERUSER_ROLE: k8s-netbox-admins

    # Plugins: the stock image has none, so an init container installs them into an
    # emptyDir on PYTHONPATH (web, worker and housekeeping all load the settings).
    # Pinned, --no-deps: NetBox's own Django etc. must stay the image's. NetBox's
    # entrypoint runs the plugins' migrations. netbox-plugin-dns 1.7 = NetBox 4.7.
    plugins:
      - netbox_dns

    initContainers:
      - name: install-plugins
        image: '{{ include "netbox.image" . }}'
        command: [/usr/local/bin/uv, pip, install, --no-cache, --python, /opt/netbox/venv/bin/python,
                  --target, /opt/plugins, --no-deps, netbox-plugin-dns==1.7.3, dnspython==2.8.0]
        securityContext:
          runAsUser: 1000          # the image defaults to root; NetBox itself runs as 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: plugins
            mountPath: /opt/plugins

    extraEnvs:
      - name: PYTHONPATH
        value: /opt/plugins

    extraVolumes:
      - name: sso-pipeline-roles
        configMap:
          name: sso-pipeline-roles
      - name: plugins
        emptyDir: {}

    extraVolumeMounts:
      - name: sso-pipeline-roles
        mountPath: /opt/netbox/netbox/netbox/sso_pipeline_roles.py
        subPath: sso_pipeline_roles.py
        readOnly: true
      - name: plugins
        mountPath: /opt/plugins
        readOnly: true
    worker:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      initContainers:
        - name: install-plugins
          image: '{{ include "netbox.image" . }}'
          command: [/usr/local/bin/uv, pip, install, --no-cache, --python, /opt/netbox/venv/bin/python,
                    --target, /opt/plugins, --no-deps, netbox-plugin-dns==1.7.3, dnspython==2.8.0]
          securityContext:
            runAsUser: 1000          # the image defaults to root; NetBox itself runs as 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: plugins
              mountPath: /opt/plugins
      extraEnvs:
        - name: PYTHONPATH
          value: /opt/plugins
      extraVolumes:
        - name: plugins
          emptyDir: {}
      extraVolumeMounts:
        - name: plugins
          mountPath: /opt/plugins
          readOnly: true

    housekeeping:
      initContainers:
        - name: install-plugins
          image: '{{ include "netbox.image" . }}'
          command: [/usr/local/bin/uv, pip, install, --no-cache, --python, /opt/netbox/venv/bin/python,
                    --target, /opt/plugins, --no-deps, netbox-plugin-dns==1.7.3, dnspython==2.8.0]
          securityContext:
            runAsUser: 1000          # the image defaults to root; NetBox itself runs as 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: plugins
              mountPath: /opt/plugins
      extraEnvs:
        - name: PYTHONPATH
          value: /opt/plugins
      extraVolumes:
        - name: plugins
          emptyDir: {}
      extraVolumeMounts:
        - name: plugins
          mountPath: /opt/plugins
          readOnly: true

    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: netbox.0b.au
          paths:
            - /

    persistence:
      enabled: true
      storageClass: longhorn
      accessMode: ReadWriteMany
      size: 5Gi

    podAnnotations:
      reloader.stakater.com/auto: "true"
