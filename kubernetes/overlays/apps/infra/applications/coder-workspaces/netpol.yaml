apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: coder-workspaces
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coder-ingress
  namespace: coder-workspaces
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          app: coder
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: coder-workspaces
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          role: ingress-controller
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-egress
  namespace: coder-workspaces
spec:
  # Not pods on VPN egress: vpn-egress below is all they get.
  podSelector:
    matchExpressions:
    - key: vpngw.example.com/egress
      operator: DoesNotExist
  policyTypes: [Egress]
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          app: coder
  - to:
    - namespaceSelector:
        matchLabels:
          role: ingress-controller
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
    ports:
    - port: 443
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          role: ingress-controller
  - to:
    - ipBlock:
        cidr: REDACTED_IP/0
        except:
          - REDACTED_IP/16
          - REDACTED_IP/16
---
# Coder workspaces on VPN egress: their only way out is WireGuard to vpngw
# (garage), one UDP port per pod. DNS, Coder's API and everything else go
# through the tunnel, so nothing in the cluster or on the LAN is reachable.
# The one exception is UDP to the Coder server pod: its direct tailnet
# connection to the agent (end-to-end WireGuard), without which every app
# byte is relayed through DERP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vpn-egress
  namespace: coder-workspaces
spec:
  podSelector:
    matchLabels:
      vpngw.example.com/egress: "true"
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock:
        cidr: REDACTED_IP/32
    ports:
    - port: 40000
      endPort: 59999
      protocol: UDP
  - to:
    - namespaceSelector:
        matchLabels:
          app: coder
      podSelector:
        matchLabels:
          app.kubernetes.io/name: coder
    ports:
    - protocol: UDP
