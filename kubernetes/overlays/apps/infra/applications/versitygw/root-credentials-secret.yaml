apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: versitygw-root-credentials
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: versitygw-root-credentials
    creationPolicy: 'Owner'
  data:
    - secretKey: rootAccessKeyId
      remoteRef:
        key: versitygw/credentials
        property: access_key
    - secretKey: rootSecretAccessKey
      remoteRef:
        key: versitygw/credentials
        property: secret_key
