---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-storage-config
spec:
  refreshInterval: "15s"
  secretStoreRef: 
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: registry-storage-config
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data: 
        config: |
          s3:
            bucket: rke-gitlab-registry
            accesskey: {{ .access_key }}
            secretkey: {{ .secret_key }}
            v4auth: true
            region: us-east-1
            regionendpoint: https://s3.0b.au
            path_style: true
  dataFrom:
  - extract:
      key: "versitygw/gitlab"
