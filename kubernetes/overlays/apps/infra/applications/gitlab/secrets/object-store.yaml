---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-store-config
spec:
  refreshInterval: "15s"
  secretStoreRef: 
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: object-store-config
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data: 
        config: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ .access_key }}
          aws_secret_access_key: {{ .secret_key }}
          aws_signature_version: 4
          endpoint: https://s3.0b.au
          host: s3.0b.au
          path_style: true
  dataFrom:
  - extract:
      key: "versitygw/gitlab"
