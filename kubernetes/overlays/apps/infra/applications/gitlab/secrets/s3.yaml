apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-creds
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: s3-creds
  data:
  - secretKey: ACCESS_KEY_ID
    remoteRef:
      key: versitygw/gitlab
      property: access_key
  - secretKey: ACCESS_SECRET_KEY
    remoteRef:
      key: versitygw/gitlab
      property: secret_key
