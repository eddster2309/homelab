apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotenberg
spec:
  interval: 30m
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  chart:
    spec:
      chart: gotenberg
      version: "1.25.0"
      sourceRef:
        kind: HelmRepository
        name: maikumori
        namespace: flux-system
      interval: 12h
  values:
    # The image is large: pulling it alone has taken ~4 minutes, and the chart's
    # 120s default then marks the rollout failed even though the pod comes up.
    # Also covers the chart's own startupProbe budget (30 x 10s).
    progressDeadlineSeconds: 600
