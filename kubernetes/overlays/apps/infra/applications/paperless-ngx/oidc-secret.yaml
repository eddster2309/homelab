apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oidc-secret
spec:
  refreshInterval: "5m"
  secretStoreRef: 
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: oidc-secret
    creationPolicy: 'Owner'
  data:
  - secretKey: config
    remoteRef: 
        key: authelia/clients/paperless-ngx
        property: config
