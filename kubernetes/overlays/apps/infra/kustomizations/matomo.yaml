apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: matomo
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/apps/infra/applications/matomo
  # The MariaDB CR cannot be applied until mariadb-operator has installed its
  # CRDs.
  dependsOn:
    - name: mariadb-operator
  healthChecks:
    - kind: HelmRelease
      name: matomo
      namespace: matomo
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  prune: true
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
