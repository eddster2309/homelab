apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  valuesContent: |
    kubeProxyReplacement: true
    k8sServiceHost: REDACTED_IP
    k8sServicePort: 6443
    tunnelProtocol: geneve # New
    bpf: # New
      masquerade: true # New
    loadBalancer:                     # New
      mode: dsr                       # New
      dsrDispatch: geneve             # New
    l2announcements:
      enabled: true
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: true
    cni:
      exclusive: false
    hostFirewall:
      enabled: false
    monitor:
      enabled: false
    prometheus:
      metricsService: true
      enabled: true
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
    hubble: 
      enabled: true
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
      # Pod egress leaving the cluster, for netflow (applications/netflow/hubble/).
      # Masquerade keeps the pod's source port, so each event names the pod behind an
      # OPNsense flow from the node (same 5-tuple). Dynamic: the agents re-read
      # cilium-flowlog-config, so filter changes don't restart them. One line per
      # connection is kept downstream (hubble-shipper dedupes), so these stay loose.
      export:
        dynamic:
          enabled: true
          config:
            content:
              - name: egress
                filePath: /var/run/cilium/hubble/egress.log
                fileMaxSizeMb: 20
                fileMaxBackups: 2
                fieldMask:
                  - time
                  - node_name
                  - verdict
                  - drop_reason_desc
                  - IP.source
                  - IP.destination
                  - l4
                  - source.namespace
                  - source.pod_name
                  - source.workloads
                  - is_reply
                  - event_type
                # Either filter matches (OR). Pods only: host-network traffic already
                # shows in NetFlow as the node itself.
                includeFilters:
                  - destination_label: ["reserved:world"]
                    source_label: ["k8s:io.kubernetes.pod.namespace"]
                    event_type: [{type: 4}]
                    reply: [false]
                  - destination_label: ["reserved:world"]
                    source_label: ["k8s:io.kubernetes.pod.namespace"]
                    verdict: [DROPPED]
                excludeFilters: []
              # Which pod owns each address Traefik proxies to (its access log has only the
              # backend's ip:port). Traefik's outbound packets to pods name the destination
              # pod; hubble-shipper keeps the first per pod IP.
              - name: pods
                filePath: /var/run/cilium/hubble/pods.log
                fileMaxSizeMb: 20
                fileMaxBackups: 2
                fieldMask:
                  - time
                  - node_name
                  - IP.destination
                  - destination.namespace
                  - destination.pod_name
                  - destination.workloads
                includeFilters:
                  - source_pod: ["traefik/"]
                    destination_label: ["k8s:io.kubernetes.pod.namespace"]
                    event_type: [{type: 4}]
                    reply: [false]
                excludeFilters: []
      relay:
        enabled: true
      ui:
        enabled: true
        ingress:
          enabled: true
          className: "traefik"
          annotations:
            traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia@kubernetescrd
          hosts:
            - cilium.0b.au

