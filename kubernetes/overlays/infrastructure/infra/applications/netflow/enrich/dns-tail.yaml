# Blocky query log (Loki) -> netflow.dns_answers, then late domain fixup + domain rollup.
# Code: ./dns_tail.py (ConfigMap netflow-enrich-code). Single replica: the cursor is
# derived from max(dns_answers.ts), so two tailers would store rows twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-tail
  labels:
    app: dns-tail
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dns-tail
  template:
    metadata:
      labels:
        app: dns-tail
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: dns-tail
          image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
          command: [uv, run, --no-project, --with, "requests>=2.32", --with, "prometheus-client>=0.21", python, /app/dns_tail.py]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: UV_CACHE_DIR
              value: /tmp/uv
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc
            - name: LOKI_TENANT
              value: homelab
            - name: CLICKHOUSE_URL
              value: http://clickhouse-netflow:8123
            - name: CLICKHOUSE_USER
              value: enricher
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: enricher_password
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 384Mi
      volumes:
        - name: code
          configMap:
            name: netflow-enrich-code
        - name: tmp
          emptyDir: {}
