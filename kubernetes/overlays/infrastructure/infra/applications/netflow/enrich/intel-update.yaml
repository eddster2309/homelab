# Threat lists (Spamhaus DROP, Feodo, Tor exits, CrowdSec decisions), cloud provider
# ranges (AWS, Google, Cloudflare, GitHub, Microsoft 365) and IANA port names ->
# netflow.intel_threat / intel_cloud / port_names. Code: ./intel_update.py
apiVersion: batch/v1
kind: CronJob
metadata:
  name: intel-update
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app: intel-update
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: intel
              image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
              command: [uv, run, --no-project, --with, "requests>=2.32", python, /app/intel_update.py]
              env:
                - name: UV_CACHE_DIR
                  value: /tmp/uv
                - name: HOME
                  value: /tmp
                - name: CLICKHOUSE_URL
                  value: http://clickhouse-netflow:8123
                - name: CLICKHOUSE_USER
                  value: enricher
                - name: CLICKHOUSE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: clickhouse-credentials
                      key: enricher_password
                # Per-source results, pushed once per run (it's a CronJob, nothing to scrape)
                - name: METRICS_PUSH_URL
                  value: http://vmagent-vicmetrics-victoria-metrics-k8s-stack.monitoring.svc:8429/api/v1/import/prometheus?extra_label=job=intel-update&extra_label=namespace=netflow
                - name: CROWDSEC_LAPI
                  value: http://crowdsec-service.crowdsec.svc:8080
                - name: CROWDSEC_BOUNCER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: crowdsec-netflow-bouncer
                      key: key
              volumeMounts:
                - name: code
                  mountPath: /app
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: code
              configMap:
                name: netflow-enrich-code
            - name: tmp
              emptyDir: {}
