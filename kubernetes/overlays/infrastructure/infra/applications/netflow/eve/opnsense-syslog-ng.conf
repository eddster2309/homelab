# Installed by hand on OPNsense (not deployed by Flux) as
#   /usr/local/etc/syslog-ng.conf.d/netflow-eve.conf
# OPNsense's syslog-ng.conf includes syslog-ng.conf.d/*.conf; this file isn't one of its
# templates, so a config reload leaves it alone. See ../README.md "Suricata".
#
# Streams every line Suricata writes to eve.json, unchanged (no syslog header), to the
# netflow eve-receiver. flow-control: while the receiver is unreachable syslog-ng stops
# reading the file and resumes where it left off, so nothing is lost short of a log rotation.
source s_netflow_eve {
    file("/var/log/suricata/eve.json" follow-freq(1) flags(no-parse));
};
destination d_netflow_eve {
    network("REDACTED_IP" port(5514) transport("tcp") template("${MSG}\n"));
};
log { source(s_netflow_eve); destination(d_netflow_eve); flags(flow-control); };
