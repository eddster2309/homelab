# Suricata EVE receiver (Vector). Config: ./vector.yaml (ConfigMap eve-receiver-config).
# OPNsense streams eve.json lines to REDACTED_IP:5514/tcp; see ../README.md "Suricata".
# It also sends pf's filterlog by remote syslog to :5515/tcp; see ../README.md "Firewall log".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-receiver
  labels:
    app: eve-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eve-receiver
  template:
    metadata:
      labels:
        app: eve-receiver
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: vector
          image: timberio/vector:0.60.0-alpine
          args: [--config, /etc/vector/vector.yaml]
          env:
            # OPNsense WAN device(s), comma-separated, as filterlog names them
            # (Interfaces → Assignments). Blocks inbound on these are dropped.
            - name: WAN_IFACES
              value: "ix0"
          ports:
            - name: eve
              containerPort: 5514
              protocol: TCP
            - name: fwlog
              containerPort: 5515
              protocol: TCP
            - name: metrics
              containerPort: 9598
              protocol: TCP
          # Restarts Vector when its Kafka producer is stuck dropping events (e.g. after a
          # broker restart). ../vector-kafka-liveness.sh
          livenessProbe:
            exec:
              command: [sh, /etc/vector-probe/vector-kafka-liveness.sh]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: probe
              mountPath: /etc/vector-probe
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: eve-receiver-config
        - name: data
          emptyDir: {}
        - name: probe
          configMap:
            name: vector-kafka-liveness
---
apiVersion: v1
kind: Service
metadata:
  name: eve-receiver
  annotations:
    # Shares goflow2's IP (different port)
    lbipam.cilium.io/ips: "REDACTED_IP"
    lbipam.cilium.io/sharing-key: "netflow"
spec:
  type: LoadBalancer
  # Cluster, not Local: same Cilium L2 announcement reason as goflow2-service.yaml
  externalTrafficPolicy: Cluster
  selector:
    app: eve-receiver
  ports:
    - name: eve
      port: 5514
      targetPort: 5514
      protocol: TCP
    - name: fwlog
      port: 5515
      targetPort: 5515
      protocol: TCP
