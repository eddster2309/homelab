# Unit tests for the fw (filterlog) transform in vector.yaml. Not deployed. Run from eve/:
#   docker run --rm -e WAN_IFACES=igc0,pppoe0 -v "$PWD":/t:ro,Z timberio/vector:0.59.0-alpine test /t/vector.yaml /t/vector-tests.yaml
# The lines follow filterlog's CSV layout; replace them with real ones from the firewall when convenient.
tests:
  - name: ipv4 tcp lan block kept
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: filterlog
          timestamp: "2026-10-16T01:02:03.456Z"
          message: "77,,,02f4bab031b57d1e30553ce08e0ec131,vlan0.20,match,block,in,4,0x0,,64,12345,0,DF,6,tcp,60,REDACTED_IP,REDACTED_IP,51234,22,0,S,123456,,64240,,mss;sackOK;TS;nop;wscale"
    outputs:
      - extract_from: fw
        conditions:
          - type: vrl
            source: |
              assert_eq!(.proto, "TCP")
              assert_eq!(.src_ip, "REDACTED_IP")
              assert_eq!(.dst_ip, "REDACTED_IP")
              assert_eq!(.src_port, 51234)
              assert_eq!(.dst_port, 22)
              assert_eq!(.tcp_flags, "S")
              assert_eq!(.length, 60)
              assert_eq!(.rule_nr, 77)
              assert_eq!(.iface, "vlan0.20")
              assert_eq!(.ts_ms, 1792112523456)
  - name: ipv6 udp block kept
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: filterlog
          message: "5,,,fae559338f65e11c53669fc3642c93c2,vlan0.30,match,reject,out,6,0x00,0x00000,64,udp,17,40,fd00::5,fd00::10,5353,5354,32"
    outputs:
      - extract_from: fw
        conditions:
          - type: vrl
            source: |
              assert_eq!(.proto, "UDP")
              assert_eq!(.src_ip, "fd00::5")
              assert_eq!(.dst_ip, "fd00::10")
              assert_eq!(.dst_port, 5354)
              assert_eq!(.action, "reject")
              assert!(!exists(.tcp_flags))
  - name: icmp has no ports
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: filterlog
          message: "9,,,abc,vlan0.20,match,block,in,4,0x0,,64,1,0,none,1,icmp,84,REDACTED_IP,REDACTED_IP,request,1,2"
    outputs:
      - extract_from: fw
        conditions:
          - type: vrl
            source: |
              assert_eq!(.proto, "ICMP")
              assert_eq!(.src_port, 0)
              assert_eq!(.dst_port, 0)
  - name: wan inbound dropped
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: filterlog
          message: "5,,,x,igc0,match,block,in,4,0x0,,52,0,0,DF,6,tcp,44,REDACTED_IP,REDACTED_IP,40000,23,0,S,1,,1024,,mss"
    no_outputs_from: [fw]
  - name: pass dropped
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: filterlog
          message: "77,,,x,vlan0.20,match,pass,in,4,0x0,,64,1,0,DF,6,tcp,60,REDACTED_IP,REDACTED_IP,51234,22,0,S,1,,64240,,mss"
    no_outputs_from: [fw]
  - name: other apps dropped
    inputs:
      - insert_at: fw
        type: log
        log_fields:
          appname: configd.py
          message: "77,,,x,vlan0.20,match,block,in,4"
    no_outputs_from: [fw]
