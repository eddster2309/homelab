# Key of the "netflow" CrowdSec bouncer (registered by the crowdsec LAPI from the
# same Vault value). A dedicated bouncer: LAPI tracks a stream position per bouncer,
# so sharing traefik's key would make traefik miss decisions.
# Vault: k8s-infra/netflow/crowdsec -> bouncer_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-netflow-bouncer
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: crowdsec-netflow-bouncer
    creationPolicy: 'Owner'
  data:
  - secretKey: key
    remoteRef:
      key: netflow/crowdsec
      property: bouncer_key
