# Vault: k8s-infra/netflow/clickhouse -> admin_password, grafana_password, netbox_sync_password,
# enricher_password.
# grafana_password is also read by monitoring/datasources/clickhouse-netflow.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-credentials
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: clickhouse-credentials
    creationPolicy: 'Owner'
  data:
  - secretKey: admin_password
    remoteRef:
      key: netflow/clickhouse
      property: admin_password
  - secretKey: grafana_password
    remoteRef:
      key: netflow/clickhouse
      property: grafana_password
  - secretKey: netbox_sync_password
    remoteRef:
      key: netflow/clickhouse
      property: netbox_sync_password
  - secretKey: enricher_password
    remoteRef:
      key: netflow/clickhouse
      property: enricher_password
