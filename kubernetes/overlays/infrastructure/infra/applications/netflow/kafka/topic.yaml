  labels:
    strimzi.io/cluster: netflow
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: 86400000        # 24h — ClickHouse is the store
    retention.bytes: 1073741824   # 1GiB cap
---
# Pod IP -> workload for Traefik's backends (hubble-shipper); read by netflow.k8s_pods_queue
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
