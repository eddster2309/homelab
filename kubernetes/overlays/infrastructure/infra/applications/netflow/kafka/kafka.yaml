# Single combined controller+broker. Kafka is only a buffer between goflow2 and
# ClickHouse, so no replication; a lost broker volume costs at most 24h of
# not-yet-consumed flows.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: netflow
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: longhorn
        deleteClaim: false
        kraftMetadata: shared
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1536Mi
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: netflow
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # Consumer-group lag (ClickHouse's Kafka engine commits as group "clickhouse")
  # and topic offsets, on :9404 like the broker.
  kafkaExporter:
    topicRegex: "flows|eve"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
  entityOperator:
    topicOperator: {}
