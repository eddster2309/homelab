apiVersion: v1
kind: Service
metadata:
  name: goflow2
  annotations:
    lbipam.cilium.io/ips: "REDACTED_IP"
    lbipam.cilium.io/sharing-key: "netflow"
spec:
  type: LoadBalancer
  # Cluster, not Local: Cilium's L2 announcement for this IP doesn't follow the
  # pod when it moves nodes, and with Local the announcing node then drops every
  # packet (goflow2 received nothing after a reschedule). DSR keeps the source IP.
  externalTrafficPolicy: Cluster
  selector:
    app: goflow2
  ports:
    - name: netflow
      port: 2055
      targetPort: 2055
      protocol: UDP
