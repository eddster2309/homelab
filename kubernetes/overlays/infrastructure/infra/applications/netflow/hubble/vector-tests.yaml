# Unit tests for the hubble and pods transforms in vector.yaml. Not deployed. Run from hubble/:
#   docker run --rm -e NODE_IP=REDACTED_IP -v "$PWD":/t:ro,Z timberio/vector:0.59.0-alpine test /t/vector.yaml /t/vector-tests.yaml
# Lines are real exporter output (trimmed by the fieldMask), from k8s-node-2.
tests:
  - name: pod egress kept
    inputs:
      - insert_at: hubble
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T02:55:40.312677208Z","verdict":"FORWARDED","IP":{"source":"REDACTED_IP","destination":"REDACTED_IP"},"l4":{"TCP":{"source_port":49762,"destination_port":443,"flags":{"SYN":true}}},"source":{"namespace":"gitlab","pod_name":"gitlab-sidekiq-all-in-1-v2-6f9c7d8b5-x2v4k","workloads":[{"name":"gitlab-sidekiq-all-in-1-v2","kind":"Deployment"}]},"node_name":"k8s-node-2.k8s.internal","event_type":{"type":4,"sub_type":3},"is_reply":false},"node_name":"k8s-node-2.k8s.internal","time":"2026-10-17T02:55:40.312677208Z"}'
    outputs:
      - extract_from: hubble
        conditions:
          - type: vrl
            source: |
              assert_eq!(.node, "k8s-node-2")
              assert_eq!(.node_ip, "REDACTED_IP")
              assert_eq!(.pod_ip, "REDACTED_IP")
              assert_eq!(.src_port, 49762)
              assert_eq!(.dst, "REDACTED_IP")
              assert_eq!(.dst_port, 443)
              assert_eq!(.proto, "TCP")
              assert_eq!(.namespace, "gitlab")
              assert_eq!(.workload, "gitlab-sidekiq-all-in-1-v2")
              assert_eq!(.workload_kind, "Deployment")
              assert_eq!(.verdict, "FORWARDED")
              assert_eq!(.ts_ms, 1792205740312)
  - name: bare pod is its own workload
    inputs:
      - insert_at: hubble
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T02:55:41.634892097Z","verdict":"FORWARDED","IP":{"source":"REDACTED_IP","destination":"REDACTED_IP"},"l4":{"UDP":{"source_port":51214,"destination_port":53}},"source":{"namespace":"default","pod_name":"debug"},"is_reply":false},"node_name":"k8s-node-2.k8s.internal"}'
    outputs:
      - extract_from: hubble
        conditions:
          - type: vrl
            source: |
              assert_eq!(.proto, "UDP")
              assert_eq!(.workload, "debug")
              assert_eq!(.workload_kind, "Pod")
  - name: drop keeps its reason
    inputs:
      - insert_at: hubble
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T03:00:00Z","verdict":"DROPPED","drop_reason_desc":"POLICY_DENIED","IP":{"source":"REDACTED_IP","destination":"REDACTED_IP"},"l4":{"TCP":{"source_port":40000,"destination_port":443}},"source":{"namespace":"authelia","pod_name":"authelia-0","workloads":[{"name":"authelia","kind":"StatefulSet"}]},"event_type":{"type":1}},"node_name":"k8s-node-1.k8s.internal"}'
    outputs:
      - extract_from: hubble
        conditions:
          - type: vrl
            source: |
              assert_eq!(.verdict, "DROPPED")
              assert_eq!(.drop_reason, "POLICY_DENIED")
              assert_eq!(.node, "k8s-node-1")
  - name: replies and icmp dropped
    no_outputs_from: [hubble]
    inputs:
      - insert_at: hubble
        type: log
        log_fields:
          message: '{"flow":{"verdict":"FORWARDED","IP":{"source":"REDACTED_IP","destination":"REDACTED_IP"},"l4":{"TCP":{"source_port":8443,"destination_port":59060}},"source":{"namespace":"traefik","pod_name":"traefik-6m5vz"},"is_reply":true}}'
      - insert_at: hubble
        type: log
        log_fields:
          message: '{"flow":{"verdict":"FORWARDED","IP":{"source":"REDACTED_IP","destination":"REDACTED_IP"},"l4":{"ICMPv4":{"type":8}},"source":{"namespace":"traefik","pod_name":"traefik-6m5vz"}}}'
  # pods.log (exporter "pods"): Traefik's packets to backends. Trimmed by the fieldMask.
  - name: backend pod named by ip
    inputs:
      - insert_at: pods
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T04:15:08.009623620Z","IP":{"destination":"REDACTED_IP"},"destination":{"namespace":"gitlab","pod_name":"gitlab-webservice-default-55c88d5c7-dvkfh","workloads":[{"name":"gitlab-webservice-default","kind":"Deployment"}]},"node_name":"k8s-node-3.k8s.internal"},"node_name":"k8s-node-3.k8s.internal","time":"2026-10-17T04:15:08.009623620Z"}'
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(.pod_ip, "REDACTED_IP")
              assert_eq!(.node, "k8s-node-3")
              assert_eq!(.namespace, "gitlab")
              assert_eq!(.pod, "gitlab-webservice-default-55c88d5c7-dvkfh")
              assert_eq!(.workload, "gitlab-webservice-default")
              assert_eq!(.workload_kind, "Deployment")
              assert_eq!(.ts_ms, 1792210508009)
  - name: bare backend pod is its own workload
    inputs:
      - insert_at: pods
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T04:15:09Z","IP":{"destination":"REDACTED_IP"},"destination":{"namespace":"default","pod_name":"debug"},"node_name":"k8s-node-2.k8s.internal"}}'
    outputs:
      - extract_from: pods
        conditions:
          - type: vrl
            source: |
              assert_eq!(.workload, "debug")
              assert_eq!(.workload_kind, "Pod")
  - name: non-pod destinations dropped
    no_outputs_from: [pods]
    inputs:
      - insert_at: pods
        type: log
        log_fields:
          message: '{"flow":{"time":"2026-10-17T04:15:10Z","IP":{"destination":"REDACTED_IP"},"node_name":"k8s-node-3.k8s.internal"}}'
