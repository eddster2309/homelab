# In-cluster side of the LLM gateway: plain HTTP in, mutual TLS out to
# jp-desktop's HAProxy, which fronts llama-swap (llama-server started on demand).
# Clients use the OpenAI API (/v1/...) at http://ollama.llm.svc:11434 (the
# Service keeps its Ollama-era name).
global
    log stdout format raw local0
    maxconn 64

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout check 5s
    timeout client 310s
    # A cold model load plus a long streamed answer.
    timeout server 300s

frontend ollama
    bind :11434
    # The kubelet's probes: answered here (never reaches the desktop) and not logged.
    monitor-uri /gateway-health
    http-request set-log-level silent if { path /gateway-health }
    http-request del-header authorization
    default_backend desktop

backend desktop
    # With the desktop off the server is down and clients get a fast 503 rather
    # than a hang. /health is llama-swap's own: it never loads a model.
    option httpchk GET /health
    http-check expect status 200
    server desktop REDACTED_IP:11435 ssl crt /etc/llm-client/tls-combined.pem verify required ca-file /usr/local/etc/haproxy/desktop-cert.pem verifyhost jp-desktop-llm sni str(jp-desktop-llm) check check-ssl inter 30s
