apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-bootstrap-admin
    creationPolicy: 'Owner'
  data:
  - secretKey: username
    remoteRef:
      key: keycloak/admin
      property: username
  - secretKey: password
    remoteRef:
      key: keycloak/admin
      property: password
