apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ch-ui
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ch-ui
    creationPolicy: 'Owner'
  data:
  # Encrypts sessions and stored connection credentials (SQLite on the PVC).
  # Changing it invalidates both.
  - secretKey: app-secret-key
    remoteRef:
      key: ch-ui/credentials
      property: app_secret_key
