# Credentials for the Longhorn backup target, which lives in versitygw
# (s3.0b.au). This is a dedicated versitygw IAM user that owns only
# the longhorn-backup bucket -- not the gateway root account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-s3-secret
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: s3-secret
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ .access_key }}'
        AWS_SECRET_ACCESS_KEY: '{{ .secret_key }}'
        AWS_ENDPOINTS: 'https://s3.0b.au'
  dataFrom:
  - extract:
      key: versitygw/longhorn
