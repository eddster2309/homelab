apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
spec:
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      guaranteedInstanceManagerCpu: 6
    defaultBackupStore:
      # versitygw. The region has to match VGW_REGION, and the bucket is owned
      # by a dedicated versitygw IAM user rather than the gateway root account.
      backupTarget: s3://longhorn-backup@us-east-1/
      backupTargetCredentialSecret: s3-secret
    ingress:
      enabled: true
      host: longhorn.0b.au
      ingressClassName: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia@kubernetescrd
    metrics:
      serviceMonitor:
        enabled: true