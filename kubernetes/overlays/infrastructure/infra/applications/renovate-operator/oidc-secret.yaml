apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-operator-oidc
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-operator-oidc
    creationPolicy: 'Owner'
  data:
  # Authelia holds the argon2id hash of this same value under 'hash'.
  - secretKey: client-secret
    remoteRef:
      key: authelia/clients/renovate-operator
      property: key
  # Any random string; the operator hashes it into the cookie encryption key.
  # Without it the key is regenerated on every restart and all sessions drop.
  - secretKey: session-secret
    remoteRef:
      key: authelia/clients/renovate-operator
      property: session
