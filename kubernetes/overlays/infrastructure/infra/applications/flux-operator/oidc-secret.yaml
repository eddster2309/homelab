apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-oidc
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flux-operator-oidc
    creationPolicy: 'Owner'
  data:
  # Consumed by the HelmRelease via valuesFrom/targetPath so the plaintext
  # client secret never lands in the values. Authelia holds the argon2id hash
  # of this same value under the 'hash' property.
  - secretKey: client-secret
    remoteRef:
      key: authelia/clients/flux-operator
      property: key
