apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  chart:
    spec:
      version: "17.1.5"
  values:
    global:
      extraEnvFrom:
        - secretRef:
            name: s3-creds
      dnsService: "rke2-coredns-rke2-coredns"
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      ingester:
        chunk_encoding: zstd
        # Flush chunks sooner so fewer are held in memory (defaults: 30m / 2h)
        chunk_idle_period: 15m
        max_chunk_age: 1h
      querier:
        # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
        max_concurrent: 2
      pattern_ingester:
        enabled: true
      limits_config:
        retention_period: 336h
        max_query_lookback: 336h
        allow_structured_metadata: true
        volume_enabled: true

      # Per-tenant overrides, reloaded at runtime without a restart.
      #
      # Only the remote tenant is constrained. The homelab tenant is left on the
      # global defaults above deliberately -- capping it risks dropping existing
      # ingest during a burst, and the point here is to stop a remote cluster
      # starving a single-replica Loki, not to police ourselves.
      runtimeConfig:
        overrides:
          asher:
            ingestion_rate_mb: 4
            ingestion_burst_size_mb: 8
            max_streams_per_user: 10000
            max_global_streams_per_user: 10000
            retention_period: 168h
      compactor:
        retention_enabled: true
        delete_request_store: s3
      # Multi-tenant. Every read and write must now carry X-Scope-OrgID; the
      # gateway supplies "homelab" for anything that doesn't, so in-cluster
      # writers (alloy, faro, syslog, the canary) need no changes. See the
      # nginxConfig snippets under gateway below.
      auth_enabled: true
      storage_config:
        aws:
          region: us-east-1
          # bucketnames: rke-loki-chunks
          # Path style keeps the bucket out of the hostname. The credentials are
          # inlined in this URL, so they must stay free of /, + and @.
          s3forcepathstyle: true
          s3: "s3://${S3_ACCESS_KEY_ID}:${S3_ACCESS_SECRET_KEY}@s3.0b.au/rke-loki-chunks"
      storage:
        type: s3
        bucketNames:
          chunks: rke-loki-chunks
          ruler: rke-loki-ruler
          admin: rke-loki-admin
        s3:
          endpoint: s3.0b.au
          region: us-east-1
          secretAccessKey: ${S3_ACCESS_SECRET_KEY}
          accessKeyId: ${S3_ACCESS_KEY_ID}
          signatureVersion: "v4"

    monitoring:
      dashboards:
        enabled: true
      rules:
        enabled: true
      serviceMonitor:
        enabled: true
    # deploymentMode: Distributed

    deploymentMode: Monolithic

    singleBinary:
      replicas: 1
      extraArgs:
        - -config.expand-env=true
      extraEnv:
        # Make the Go GC keep heap under ~5.2Gi so RSS stays near the 6Gi limit
        - name: GOMEMLIMIT
          value: "5200MiB"
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          # Headroom for the second tenant. Provisional: sized off asher's
          # ingestion cap above rather than a measured log rate, so revisit once
          # it has been sending for a day. Current steady state is ~1.1Gi.
          memory: 6Gi
      persistence:
        size: 20Gi
    
    lokiCanary:
      enabled: true
      kind: Deployment
      replicas: 1

    # Zero out replica counts of other deployment modes
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomPlanner:
      replicas: 0
    bloomBuilder:
      replicas: 0
    bloomGateway:
      replicas: 0

    # This exposes the Loki gateway so it can be written to and queried externaly
    gateway:
      replicas: 1

      nginxConfig:
        # Default tenant for clients that send no X-Scope-OrgID. A header the
        # client did send is preserved, so vmauth's forced value wins for remote
        # tenants while everything in-cluster keeps working untouched.
        httpSnippet: |
          map $http_x_scope_orgid $tenant {
            default $http_x_scope_orgid;
            ""      "homelab";
          }
        # Must be set per-location, not on the server block: nginx drops
        # inherited proxy_set_header directives in any location that defines one
        # of its own, and several of the chart's locations do (the tail and
        # query locations set Upgrade and X-Query-Tags). This snippet is
        # injected into every location block, so none of them miss it.
        locationSnippet: |
          proxy_set_header X-Scope-OrgID $tenant;

      ingress:
        enabled: true
        ingressClassName: traefik
        # monitoring.example.com is served by the VMAuth in ./ingest now.
        # loki.example.com stays, anonymous, resolving to the homelab tenant
        # via the map above; retire it once confirmed unused.
        hosts:
          - host: loki.example.com
            paths:
              - path: /
                pathType: ImplementationSpecific

    chunksCache:
      # Default is ~9.8Gi — reduced for homelab
      allocatedMemory: 512
      resources:
        requests:
          memory: 600Mi
        limits:
          memory: 600Mi

    resultsCache:
      # Default is ~1.2Gi — reduced for homelab
      allocatedMemory: 128
      resources:
        requests:
          memory: 200Mi
        limits:
          memory: 200Mi

    minio:
      enabled: false
