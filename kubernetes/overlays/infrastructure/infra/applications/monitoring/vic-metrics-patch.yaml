apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vicmetrics
  namespace: monitoring
spec:
  # Grafana's image alone has taken 6+ minutes to pull; the 5m default then
  # rolls the whole stack back before the new pod can start.
  timeout: 15m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.72.5"
      # Lets Renovate resolve the pinned version; must match the base.
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  values:

    defaultDashboards:
      enabled: true
      defaultTimzezone: "Australia/Sydney"
    vmsingle:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    vmcluster:
      enabled: true
      spec:
        vmstorage:
          replicaCount: 1
          extraArgs:
            downsampling.period: "{job=\"nsw_fuel_prices\"}:30d:1h,{job=\"nsw_fuel_prices\"}:90d:2h,30d:10m,180d:30m,1y:1h"
            retentionPeriod: "2y"
            retentionFilter: "{job=\"nsw_fuel_prices\"}:2y"
          storage:
            volumeClaimTemplate:
              metadata:
                labels:
                  recurring-job-group.longhorn.io/default: disabled
              spec:
                resources:
                  requests:
                    storage: 80Gi
          image:
            repository: registry.git.0b.au/jack/victoria-metrics-patcher/vmstorage
            tag: v1.144.0-enterprise-cluster
        vminsert:
          replicaCount: 1
          image:
            repository: registry.git.0b.au/jack/victoria-metrics-patcher/vminsert
            tag: v1.144.0-enterprise-cluster
        vmselect:
          replicaCount: 1
          image:
            repository: registry.git.0b.au/jack/victoria-metrics-patcher/vmselect
            tag: v1.144.0-enterprise-cluster
          resources:
            requests:
              cpu: 200m
              memory: 500Mi
            limits:
              cpu: 2000m
              memory: 1000Mi
      ingress:
        insert:
          enabled: true
          ingressClassName: traefik
          # monitoring.example.com is served by the VMAuth in ./ingest now --
          # two Ingress objects must not claim overlapping paths on one host.
          # vm-insert.example.com stays so anything pointed straight at that
          # hostname keeps working; retire it once confirmed unused.
          hosts:
            - vm-insert.example.com
          path: /insert
    vmagent:
      enabled: true
      spec:
        extraArgs:
          promscrape.maxScrapeSize: "67108864"
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 500m
            memory: 500Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          traefik.ingress.kubernetes.io/router.middlewares: traefik-authelia@kubernetescrd
        hosts:
          - vm-agent.0b.au
    alertmanager:
      ingress:
        enabled: true
        ingressClassName: traefik
        # Internal websecure only, and no Authelia: wazuh01 POSTs alerts to
        # /api/v2/alerts, and forward-auth can't be satisfied by a machine.
        hosts:
          - alertmanager.example.com
    victoria-metrics-operator:
      operator:
        disable_prometheus_converter: false
    grafana:
      image:
        tag: "13.2"
      enabled: true
      replicas: 1
      # RWO PVC: the old pod has to release it before the new one can attach
      deploymentStrategy:
        type: Recreate

      persistence:
        enabled: true
        size: 10Gi
      # Grafana preinstalls the drilldown apps but only when absent: copies
      # already on the PVC are never moved across a major version, so 1.x
      # lingered and Grafana 13 reported "App not found". Pinned here to force
      # the upgrade -- bump by hand, Renovate doesn't track these.
      plugins:
        - victoriametrics-logs-datasource
        - grafana-opensearch-datasource
        - grafana-metricsdrilldown-app@2.5.1
        - grafana-lokiexplore-app@2.6.0
        - grafana-exploretraces-app@2.2.1
      imageRenderer:
        enabled: true
        image:
          tag: v5.12.4
          pullPolicy: IfNotPresent
        # Must match Grafana's GF_RENDERING_RENDERER_TOKEN (envFromSecrets below)
        envValueFrom:
          AUTH_TOKEN:
            secretKeyRef:
              name: renderer-token
              key: GF_RENDERING_RENDERER_TOKEN
        podAnnotations:
          reloader.stakater.com/auto: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          searchNamespace: ALL
        datasources:
          enabled: true
          label: grafana_datasource
          searchNamespace: ALL
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.0b.au
      env:
        GF_AUTH_GENERIC_OAUTH_ENABLED: true
        GF_AUTH_GENERIC_OAUTH_NAME: "Eddster Auth"
        GF_AUTH_GENERIC_OAUTH_ICON: signin
        GF_AUTH_OAUTH_AUTO_LOGIN: true
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'k8s-grafana-viewer') && 'Viewer' || contains(groups[*], 'k8s-grafana-admin') && 'Admin' || contains(groups[*], 'k8s-grafana-editor') && 'Editor' || contains(groups[*], 'k8s-grafana-global-admin') && 'GrafanaAdmin'"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: true
        GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: true
        GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: true
        GF_SERVER_ROOT_URL: "https://grafana.0b.au"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile groups"
        GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: false
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.0b.au/api/oidc/authorization
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.0b.au/api/oidc/token
        GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.0b.au/api/oidc/userinfo
        GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
        GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
        GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
        GF_AUTH_GENERIC_OAUTH_USE_PKCE: true
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
        GF_ANALYTICS_ENABLED: false
        GF_ANALYTICS_REPORTING_ENABLED: false
        GF_FEEDBACK_LINKS_ENABLED: false
        GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: true
        GF_SNAPSHOTS_ENABLED: false
        GF_AUTH_DISABLE_LOGIN_FORM: true
        GF_DISABLE_SIGNOUT_MENU: true
        GF_NEWS_NEWS_FEED_ENABLED: false
        GF_DATE_FORMATS_DEFAULT_TIMEZONE: "Australia/Sydney"
        GF_PUBLIC_DASHBOARDS_ENABLED: false
        GF_FEATURE_TOGGLES_FEATURE_DASHGPT: false
        GF_FEATURE_TOGGLES_FEATURE_ONPREMTOCLOUDMIGRATIONS: false

      
      envFromSecret: auth-secret
      envFromSecrets:
        - name: renderer-token
    prometheus-node-exporter:
      enabled: true
