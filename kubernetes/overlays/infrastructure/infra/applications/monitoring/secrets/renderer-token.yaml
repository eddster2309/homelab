# Shared token between Grafana and grafana-image-renderer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renderer-token
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renderer-token
    creationPolicy: 'Owner'
  data:
  # Read by the Grafana chart (imageRenderer.existingSecret) since 13.x
  - secretKey: token
    remoteRef:
      key: grafana/renderer
      property: token
  # Kept so the pre-upgrade pods and a Helm rollback still resolve their env
  - secretKey: GF_RENDERING_RENDERER_TOKEN
    remoteRef:
      key: grafana/renderer
      property: token
