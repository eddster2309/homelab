# Shared token between Grafana and grafana-image-renderer.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renderer-token
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renderer-token
    creationPolicy: 'Owner'
  data:
  - secretKey: GF_RENDERING_RENDERER_TOKEN
    remoteRef:
      key: grafana/renderer
      property: token
