# Basic-auth password for the asher tenant's ingest credential.
# Vault: k8s-infra/monitoring/tenants/asher -> property "password"
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring-tenant-asher
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: monitoring-tenant-asher
    creationPolicy: 'Owner'
  data:
    - secretKey: password
      remoteRef:
        key: monitoring/tenants/asher
        property: password
