apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  chart:
    spec:
      chart: k8s-monitoring
      version: "4.3.2"
      # Lets Renovate resolve the pinned version; must match the base.
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    cluster:
      name: rke-alloy
    destinations:
      localLoki:
        type: loki
        url: http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push
    clusterEvents:
      enabled: true
      collector: logs-collector
    nodeLogs:
      enabled: true
      collector: logs-collector
    podLogsViaLoki:
      enabled: true
      collector: logs-collector
      # Sidekiq was ~900MB/day, mostly routine job bookkeeping. Every job logs a
      # "start" line that its "done" line repeats, UnlockPipelinesInQueueWorker
      # alone is ~10MB/h of successful no-op runs, and product_usage_data is
      # outbound telemetry. Failed jobs log job_status=fail and are kept.
      extraLogProcessingStages: |
        stage.match {
          selector = "{namespace=\"gitlab\", container=\"sidekiq\"}"
          stage.json {
            expressions = { job_status = "", worker_class = "class", subcomponent = "" }
          }
          stage.drop {
            source              = "job_status"
            value               = "start"
            drop_counter_reason = "sidekiq_job_start"
          }
          stage.drop {
            source              = "worker_class,job_status"
            separator           = ";"
            value               = "Ci::UnlockPipelinesInQueueWorker;done"
            drop_counter_reason = "sidekiq_noisy_worker"
          }
          stage.drop {
            source              = "subcomponent"
            value               = "product_usage_data"
            drop_counter_reason = "sidekiq_usage_telemetry"
          }
        }
        // Internal (websecure) access logs, minus metric and log ingest: ~5 req/s
        // of remote-write and Loki pushes that say nothing about who uses what.
        // Ingest arriving on websecure-pub (edge01) is kept for the edge01 dashboard.
        stage.match {
          selector = "{namespace=\"traefik\", container=\"traefik\"}"
          stage.json {
            expressions = { entrypoint = "entryPointName", service = "ServiceName" }
          }
          stage.drop {
            source              = "entrypoint,service"
            separator           = ";"
            expression          = "^websecure;monitoring-(vmauth-ingest|vminsert|loki-gateway)[^@]*@kubernetes$"
            drop_counter_reason = "traefik_internal_ingest"
          }
        }
    selfReporting:
      enabled: true
      collector: logs-collector
    collectors:
      logs-collector:
        presets: [filesystem-log-reader, daemonset]
        alloy:
          extraPorts:
            - name: syslog
              port: 51515
              targetPort: 51515
              protocol: UDP
        extraConfig: |
          loki.relabel "syslog_extract_labels" {
            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_sd_rsyslog_src_ip"]
              target_label  = "src_ip"
            }
            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__syslog_message_severity"]
              target_label  = "severity"
            }
            rule {
              source_labels = ["__syslog_message_facility"]
              target_label  = "facility"
            }
            forward_to = [loki.write.localloki.receiver]
          }

          loki.source.syslog "syslog_in" {
            listener {
              address               = "REDACTED_IP:51515"
              protocol              = "udp"
              syslog_format         = "rfc5424"
              label_structured_data = true
              labels                = { job = "syslog" }
            }
            relabel_rules = loki.relabel.syslog_extract_labels.rules
            forward_to = [loki.write.localloki.receiver]
          }