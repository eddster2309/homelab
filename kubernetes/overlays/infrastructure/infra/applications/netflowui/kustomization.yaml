apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Netflow UI (GitLab: homelab/homelab-network-ui): Next.js UI + FastAPI API for
# the netflow ClickHouse data, behind Authelia at netflow.0b.au.
#
# Two parts, because a top-level `namespace:` would also move the kube-system
# Role below into netflow:
# - app/   everything in the netflow namespace (HelmRelease, ExternalSecrets)
# - rbac/  the API's read-only cluster access, namespaces set explicitly
resources:
- ./app
- ./rbac
