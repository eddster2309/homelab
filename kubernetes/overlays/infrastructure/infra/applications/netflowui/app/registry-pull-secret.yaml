# Pulls registry.git.0b.au/homelab/homelab-network-ui/{api,ui} (a private project).
# Vault: k8s-infra/registry -> key, a GitLab group access token with read_registry.
# Group tokens accept any non-blank username.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netflowui-registry
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netflowui-registry
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.git.0b.au":{"username":"group-token","password":"{{ .key }}","auth":"{{ printf "group-token:%s" .key | b64enc }}"}}}
  dataFrom:
  - extract:
      key: registry
