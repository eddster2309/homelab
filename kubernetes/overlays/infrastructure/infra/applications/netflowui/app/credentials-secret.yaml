# Vault: k8s-infra/netflow/netflowui. Every property becomes an env var of the API
# (envFrom), so the property names are the variable names:
#   NETBOX_TOKEN         NetBox v2 token (nbt_...), read-only
#   OMADA_URL            Omada controller URL (kept here, not in git: it's an IP)
#   OMADA_USER           controller Viewer account   } either this pair...
#   OMADA_PASS                                       }
#   OMADA_CLIENT_ID      Open API client credentials } ...or this one (preferred)
#   OMADA_CLIENT_SECRET                              }
#   ABUSEIPDB_API_KEY    optional: on-demand "Ask AbuseIPDB" IP lookups (free tier)
#   GREYNOISE_API_KEY    optional: on-demand GreyNoise community IP lookups
# All but NETBOX_TOKEN are optional: without OMADA_URL the Omada integration is off.
# The ClickHouse password is not here: it's grafana_password from the netflow
# overlay's clickhouse-credentials secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netflowui-credentials
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: netflowui-credentials
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: netflow/netflowui
