apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      version: "1.22.0"
      # Lets Renovate resolve the pinned version; must match the base.
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  values:
    policy: sync
    logLevel: debug
    logFormat: json
    domainFilters:
      - example.com # only handle DDNS for *.int.shirwalab.net
      - 0b.au
    # txtPrefix: external-dns-internal-
    # txtOwnerId: shirwalab-internal
    sources:
      - service
      - ingress
      - traefik-proxy
    provider: rfc2136
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: ipa-tsig-secret
            key: rfc2136_tsig_secret
    extraArgs:
      - --rfc2136-host=ipa01.internal
      - --rfc2136-port=53
      - --rfc2136-zone=example.com
      - --rfc2136-zone=0b.au
      - --rfc2136-tsig-keyname=acme-update
      - --rfc2136-tsig-secret-alg=hmac-sha512
      - --rfc2136-tsig-axfr
