apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netflowui
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/netflowui
  dependsOn:
    - name: repositories-infra
    - name: external-secrets-config
    - name: authelia
    # the netflow namespace and its clickhouse-credentials secret
    - name: netflow
  healthChecks:
    - kind: HelmRelease
      name: netflowui
      namespace: netflow
      apiVersion: helm.toolkit.fluxcd.io/v2
  prune: true
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
