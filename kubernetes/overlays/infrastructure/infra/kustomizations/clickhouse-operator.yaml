apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse-operator
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/clickhouse-operator
  dependsOn:
    - name: repositories-infra
  healthChecks:
    - kind: HelmRelease
      name: clickhouse-operator
      namespace: clickhouse-operator
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  prune: false
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
