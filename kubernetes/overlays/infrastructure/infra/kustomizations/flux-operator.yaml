---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/flux-operator
  dependsOn:
    - name: repositories-infra
  healthChecks:
    - kind: HelmRelease
      name: flux-operator
      namespace: flux-system
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  # Never prune: dropping this Kustomization would take the FluxInstance and
  # ResourceSet CRDs with it. Matches cloudnative-pg and mariadb-operator.
  prune: false
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
