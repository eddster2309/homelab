apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ch-ui
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/ch-ui
  dependsOn:
    - name: repositories-infra
    - name: external-secrets-config
    - name: authelia
  healthChecks:
    - kind: HelmRelease
      name: ch-ui
      namespace: ch-ui
      apiVersion: helm.toolkit.fluxcd.io/v2
  prune: true
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
