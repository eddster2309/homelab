---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/keycloak
  dependsOn:
    - name: repositories-infra
    - name: external-secrets-config
    - name: traefik
    - name: cloudnative-pg
    - name: cert-manager
  healthChecks:
    - kind: HelmRelease
      name: keycloak
      namespace: keycloak
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  prune: true
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
