apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llm-gateway
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/llm-gateway
  dependsOn:
    # the selfsigned-cluster-issuer ClusterIssuer
    - name: cert-manager-config
    # Open WebUI's OIDC client secret
    - name: external-secrets-config
  prune: true
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
