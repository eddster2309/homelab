apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netflow
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/netflow
  prune: true
  dependsOn:
    - name: external-secrets-config
    - name: strimzi
    - name: clickhouse-operator
  healthChecks:
    - kind: Kafka
      name: netflow
      namespace: netflow
      apiVersion: kafka.strimzi.io/v1
    - kind: Deployment
      name: goflow2
      namespace: netflow
      apiVersion: apps/v1
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
