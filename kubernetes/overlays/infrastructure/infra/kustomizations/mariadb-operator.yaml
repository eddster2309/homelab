apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/mariadb-operator
  dependsOn:
    - name: repositories-infra
  healthChecks:
    - kind: HelmRelease
      name: mariadb-operator
      namespace: mariadb-operator
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  # Never prune: dropping this Kustomization would take the CRDs, and with them
  # every MariaDB and its PVCs, out of the cluster. Matches cloudnative-pg.
  prune: false
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
