apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./kubernetes/overlays/infrastructure/infra/applications/crowdsec
  prune: true
  dependsOn:
    - name: repositories-infra
    - name: external-secrets-config
    - name: longhorn
    # For the Middleware CRD.
    - name: traefik
  healthChecks:
    - kind: HelmRelease
      name: crowdsec
      namespace: crowdsec
      apiVersion: helm.toolkit.fluxcd.io/v2beta1
  sourceRef:
    kind: "GitRepository"
    name: "flux-system"
