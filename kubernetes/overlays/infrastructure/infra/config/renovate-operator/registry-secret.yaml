# Read access to registry.git.0b.au for Renovate's docker lookups of private
# images (e.g. homelab/homelab-network-ui). Same Vault entry as the netflowui
# pull secret: k8s-infra/registry -> key (a group access token, so any username).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-registry
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-registry
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        username: 'group-token'
        password: '{{ .key }}'
  dataFrom:
  - extract:
      key: registry
