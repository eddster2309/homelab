apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secret
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: renovate-secret
    creationPolicy: 'Owner'
    template:
      engineVersion: v2
      data:
        # One fine-grained GitHub PAT serves as both the platform token and the
        # github.com token Renovate uses for release notes / GitHub datasources.
        RENOVATE_TOKEN: '{{ .token }}'
        GITHUB_COM_TOKEN: '{{ .token }}'
        GITHUB_COM_USER: 'eddster2309'
  dataFrom:
  - extract:
      key: renovate/credentials
